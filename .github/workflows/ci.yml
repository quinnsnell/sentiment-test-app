name: CI/CD

on:
  push:
    branches: [main, staging]
    # Docs-only changes don't trigger a deploy — saves the 5-6 min Coolify cycle.
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
      - '.dockerignore'
      - 'docs/**'
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - '**/*.md'
      - '.env.example'
      - '.gitignore'
      - '.dockerignore'
      - 'docs/**'

jobs:
  # Runs on every push and every PR. GitHub-hosted runner is fine — unit tests
  # don't hit the VPN-only LLM. SKIP_LOCAL_MODEL=1 so the HF pipeline doesn't
  # load during tests (we don't need transformers/torch either — big install
  # skip).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lightweight test dependencies (no torch/transformers)
        run: pip install fastapi 'uvicorn[standard]' httpx pydantic pytest

      - name: Unit tests
        env:
          SKIP_LOCAL_MODEL: "1"
        run: pytest tests/ -v

      # Removed: docker build. It duplicates what Coolify does immediately after
      # this job and pulls the 2 GB base image from GHCR every run (no cache on
      # GitHub-hosted runners) — ~2 min saved per push. Coolify's build is the
      # authoritative "does the Dockerfile actually work" check.

  # Deploys to STAGING. Runs on push to `staging` (not on PRs), after `test` passes.
  # Coolify's post-deploy health check on /health verifies the LLM path works
  # end-to-end; if /health fails, Coolify marks the deploy unhealthy.
  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging deploy
        run: |
          curl -fsSL "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_STAGING }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"

  # Deploys to PROD. Runs on push to `main` (usually via merged PR from `staging`),
  # after `test` passes.
  deploy-prod:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify prod deploy
        run: |
          curl -fsSL "${{ secrets.COOLIFY_DEPLOY_WEBHOOK_PROD }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
