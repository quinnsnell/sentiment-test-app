name: Build base image

# Builds and pushes ghcr.io/quinnsnell/sentiment-test-app-base:latest.
# Runs when requirements.txt or Dockerfile.base changes, or when manually
# dispatched. The app's main Dockerfile uses this base to skip re-installing
# torch + downloading the HF model on every deploy.

on:
  push:
    branches: [main]
    paths:
      - sentiment/requirements.txt
      - sentiment/Dockerfile.base
      - .github/workflows/build-base.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push base image
        uses: docker/build-push-action@v5
        with:
          context: ./sentiment
          file: sentiment/Dockerfile.base
          push: true
          tags: |
            ghcr.io/quinnsnell/sentiment-test-app-base:latest
            ghcr.io/quinnsnell/sentiment-test-app-base:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/quinnsnell/sentiment-test-app-base:buildcache
          cache-to: type=registry,ref=ghcr.io/quinnsnell/sentiment-test-app-base:buildcache,mode=max
